<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head %} {% endblock %}
  </head>
  <body>
    <div class="flex flex-row justify-between items-center w-full h-full p-4">
      <div>
        <a href="/" class="text-xl cursor-pointer text-gray-800">Imobiliare</a>
      </div>
      <div class="flex flex-row gap-4">
        {% if loggedIn == False %}
        <a
          href="/auth/login"
          class="w-full text-xl cursor-pointer text-gray-800 border-b-2 p-1 border-white duration-300 hover:border-red-800"
        >
          Login
        </a>
        <a
          href="/auth/signup"
          class="w-full text-xl cursor-pointer text-gray-800 border-b-2 p-1 border-white duration-300 hover:border-red-800"
        >
          Signup
        </a>
        {% else %}
        <a
          href="/inregistreaza-contract"
          class="w-full text-xl cursor-pointer text-gray-800 border-b-2 p-1 border-white duration-300 hover:border-red-800"
        >
          Inregistreaza
        </a>
        <a
          href="/account"
          class="w-full text-xl cursor-pointer text-gray-800 border-b-2 p-1 border-white duration-300 hover:border-red-800"
        >
          Cont
        </a>
        <a
          href="/auth/logout"
          class="w-full text-xl cursor-pointer text-gray-800 border-b-2 p-1 border-white duration-300 hover:border-red-800"
        >
          Logout
        </a>
        {% endif %}
      </div>
    </div>
    {% block body %} {% endblock %}
  </body>
</html>
